[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terminal-relay"
version = "0.1.0"
description = "Terminal Relay — timed team relay with baton identity and challenges"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "PySide6>=6.6",
    "pyserial>=3.5",
    "pygame>=2.5",
    "pywinpty>=2.0",
    "pyte>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]
[project.scripts]
relay = "baton_relay.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/baton_relay"]

[tool.hatch.build.targets.sdist]
include = ["src/baton_relay", "config", "questions", "challenges", "docs", "firmware", "scripts", "staff", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "marathon: hour-scale stress (opt-in: pytest -m marathon)",
]
addopts = "-m 'not marathon'"

[tool.ruff]
line-length = 100
target-version = "py311"
