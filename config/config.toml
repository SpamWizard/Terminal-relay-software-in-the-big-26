# Terminal Relay — sample organizer config
# Copy or edit in place. Team names are entered at the startup screen, not here.

[team]
size = 4
# Rotation order is person index 0..size-1 (wraps). Default: sequential.
rotation = [0, 1, 2, 3]

[[team.people]]
id = "p1"
label = "1"
# Okabe–Ito colorblind-safe hues (also distinct by lightness). Numbers remain the main ID.
color = "#56B4E9"
# Baton: which two pins (1-5) are tied to GND. Must be a known pair.
baton_pins = [1, 2]

[[team.people]]
id = "p2"
label = "2"
color = "#E69F00"
baton_pins = [1, 3]

[[team.people]]
id = "p3"
label = "3"
color = "#009E73"
baton_pins = [1, 4]

[[team.people]]
id = "p4"
label = "4"
color = "#CC79A7"
baton_pins = [1, 5]

# Extra Okabe–Ito picks if you grow to 5–6 people: #F0E442 (yellow), #D55E00 (vermillion), #0072B2 (blue)

# Spare batons (not assigned to a team seat) can still be remapped later:
# 2+3, 2+4, 2+5, 3+4, 3+5, 4+5

[timers]
# Numbers OR simple math strings: "4*60", "40 * 60", "(90+30)"
leg_seconds = "5"
game_seconds = "45*60"
# If true, leg timer keeps ticking while frozen (baton out).
leg_runs_while_frozen = true
debounce_ms = 80

[serial]
# port = "COM3"          # Windows example
# port = "/dev/ttyACM0"  # Linux example
port = "auto"
baud = 115200
heartbeat_timeout_ms = 1500

[scoring]
partial_credit = true
wrong_answer_penalty = 0
redo_multiplier = 0.5

[questions]
# Played in order. Each file is one set.
files = [
    "questions/01_type_test.json",
]
redo_missed_at_set_end = true

[controller]
enabled = true
inactivity_lock_seconds = 30
# Unlock chord and bindings documented in docs/controller.md (phase 4).
unlock_hold_ms = 1000

[organizer]
# Generate with: python -c "from baton_relay.security import hash_password; print(hash_password('change-me'))"
# Placeholder hash is for password "change-me" (dev only).
password_hash = "argon2$dev$change-me"

[containers]
runtime = "podman"  # podman | docker — Linux only
network_mode = "none"
memory_limit = "256m"
cpu_limit = 0.5
default_timeout_seconds = 600

[paths]
results_dir = "results"
checkpoint_path = "data/checkpoints/current.json"

# Pick a preset with name= … (restart app to apply). Optional accent/background/foreground
# here override the chosen preset.
[theme]
name = "neon_terminal"

[themes.neon_terminal]
accent = "#00f5d4"
background = "#0a0e14"
foreground = "#e6edf3"

[themes.amber_grid]
accent = "#ffb703"
background = "#140f0a"
foreground = "#f5efe6"

[themes.violet_pulse]
accent = "#c77dff"
background = "#100a18"
foreground = "#f0e6ff"

[themes.ice]
accent = "#90e0ef"
background = "#071018"
foreground = "#e8f4f8"

[themes.crimson]
accent = "#ff4d6d"
background = "#12060a"
foreground = "#ffe6ec"

[ui]
# Correct-answer toast timing (milliseconds)
correct_fade_in_ms = 160
correct_hold_ms = 480
correct_fade_out_ms = 200
# Loud-but-not-harsh chime when a person switch is required
switch_sound = true
switch_sound_volume = 0.9
