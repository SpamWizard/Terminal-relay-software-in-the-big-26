# Terminal Relay — organizer config (editable in-app)

[team]
size = 3
rotation = [0, 1, 2]

[[team.people]]
id = "p1"
label = "A"
color = "#56B4E9"
baton_pins = [1, 2]

[[team.people]]
id = "p2"
label = "B"
color = "#E69F00"
baton_pins = [1, 3]

[[team.people]]
id = "p3"
label = "C"
color = "#009E73"
baton_pins = [1, 4]

[timers]
leg_seconds = 45
game_seconds = 1500
leg_runs_while_frozen = false
debounce_ms = 80
resume_bonus_seconds = 10

[serial]
port = "auto"
baud = 115200
heartbeat_timeout_ms = 1500

[scoring]
partial_credit = true
wrong_answer_penalty = 0
redo_multiplier = 0.5

[questions]
files = [
    "challenges/binary",
    "challenges/morse",
    "challenges/whitespace",
    "challenges/zero_width",
    "challenges/lsb",
    "challenges/broken_png",
    "challenges/log_hunt",
    "challenges/patch_it",
    "challenges/identify",
    "questions/fake_logos.json",
]
redo_missed_at_set_end = false
warmup_count = 0
board_slots = 8
questions_per_pick = 1

[organizer]
password_hash = "argon2$dev$change-me"

[paths]
results_dir = "results"
checkpoint_path = "data/checkpoints/current.json"

[scoreboard]
enabled = true
base_url = "http://192.168.1.50:8080"
# api key = Pi IP (same as host in base_url); no separate secret
machine_id = "station-3"
timeout_seconds = 10

[theme]
name = "deep_space"

[themes.amber_grid]
accent = "#ffb703"
background = "#140f0a"
foreground = "#f5efe6"

[themes.crimson]
accent = "#ff4d6d"
background = "#12060a"
foreground = "#ffe6ec"

[themes.deep_space]
accent = "#7dd3fc"
background = "#050816"
foreground = "#e8f1ff"

[themes.ice]
accent = "#90e0ef"
background = "#071018"
foreground = "#e8f4f8"

[themes.neon_terminal]
accent = "#00f5d4"
background = "#0a0e14"
foreground = "#e6edf3"

[themes.violet_pulse]
accent = "#c77dff"
background = "#100a18"
foreground = "#f0e6ff"

[ui]
correct_fade_in_ms = 160
correct_hold_ms = 480
correct_fade_out_ms = 200
switch_sound = true
switch_sound_volume = 0.9
